name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: powershell -File packaging/msix/build.ps1
        env:
          # Partner Center > Product identity; set under Settings > Secrets and variables > Actions > Variables
          MSIX_IDENTITY: ${{ vars.MSIX_IDENTITY }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
      # stage flat so the artifact (and the release job) can address files by name
      - shell: bash
        run: |
          mkdir dist
          cp target/release/mdv.exe packaging/msix/out/mdv.msix dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - run: cargo build --release
      - run: tar -czf mdv-linux-x86_64.tar.gz -C target/release mdv -C ../../packaging/linux mdv.desktop mdv.svg install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: mdv-linux-x86_64.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output mdv target/aarch64-apple-darwin/release/mdv target/x86_64-apple-darwin/release/mdv
          chmod +x mdv
      - run: brew install librsvg && sh packaging/macos/bundle.sh ./mdv
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: packaging/macos/out/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/mdv.exe
            dist/mdv.msix
            dist/mdv-linux-x86_64.tar.gz
            dist/*.dmg
