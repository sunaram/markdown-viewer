name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - run: powershell -File packaging/msix/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/release/mdv.exe
            packaging/msix/out/mdv.msix

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - run: cargo build --release
      - run: tar -czf mdv-linux-x86_64.tar.gz -C target/release mdv -C ../../packaging/linux mdv.desktop mdv.svg install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: mdv-linux-x86_64.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output mdv target/aarch64-apple-darwin/release/mdv target/x86_64-apple-darwin/release/mdv
          chmod +x mdv
      - run: brew install librsvg && sh packaging/macos/bundle.sh ./mdv
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: packaging/macos/out/*.dmg
