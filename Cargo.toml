[package]
name = "mdv"
version = "0.1.0"
edition = "2024"

[dependencies]
latex2mathml = "0.2.3"
miniz_oxide = "0.9.1"
muda = { version = "0.21.2", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
tao = "0.37.1"
wry = "0.57.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
